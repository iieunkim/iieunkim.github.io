<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♥ Happy Birthday ♥</title>

<style>
    
body {
    background-color: #fffdf9;
    font-family: "굴림", sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
    color: #444;
}

/* 반짝이 제목 */
.title {
    font-size: 28px;
    color: #ff8fa3;
    animation: blink 1s infinite alternate;
}

@keyframes blink {
    from { opacity: 1; }
    to { opacity: 0.6; }
}

/* 카드 박스 */
.box {
    background: white;
    border: 3px dotted #ffc2d1;
    padding: 20px;
    margin: 20px auto;
    max-width: 350px;
}

/* 버튼 */
button {
    background: #ffe5ec;
    border: 2px solid #ffb3c6;
    padding: 8px 15px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #ffd6e0;
}

/* 숨김 편지 */
#letter {
    display: none;
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.6;
}


</style>
</head>

<body>
    <p>🔐 비밀번호를 입력하세요</p>
<input type="password" id="password">
<button onclick="checkPassword()">입장하기</button>

<br> <br> 힌트: 생일 + 우리가 사귄 날짜 
<br><br> ex) 03290922
<script> 
    function checkPassword() {
    var pw = document.getElementById("password").value;

    if (pw === "02180721") {   // 여기 비밀번호 바꿔도 됨
        window.location.href = "secret.html";
    } else {
        alert("❌ 다시 생각해보세요! 😝 ");
    }
}

</script>






<script>
function openLetter() {
    document.getElementById("letter").style.display = "block";
}

// 가짜 방문자수 증가
let num = 1;
setInterval(function(){
    num++;
    document.getElementById("count").innerText = 
        String(num).padStart(4,'0');
}, 3000);
</script>

</body>
</html>
