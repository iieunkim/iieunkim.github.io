<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🎂 Happy Birthday 🎂</title>
<style>
body { 
    margin: 0;
    background-color: #eae6df;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Gowun Dodum', sans-serif;
}

.cake {
    width: 40vw;
    height: 38vh;
    border-radius: 50px;
    position: relative;

    background:
        repeating-linear-gradient(
            to bottom,
            #ffeaea 0px,
            #ffeaea 40px,
            #ffdede 45px,
            #ffdede 90px
        );

    box-shadow: 0 40px 120px rgba(0,0,0,0.18);
}



/* 윗부분 크림 */
.cream {
    position: absolute;
    top: -5vh;
    width: 100%;
    height: 9vh;
    background: radial-gradient(circle at center, #ffffff 60%, #f8f8f8 100%);
    border-radius: 50%;
}


/* 초 */
.candle {
    width: 1.2vw;
    height: 10vh;
    background: rgb(235, 200, 214);
    position: absolute;
    top: -12vh;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 5px;
}



/* 불 */
.flame {
    width: 1.5vw;
    height: 2.2vw;
    background: radial-gradient(circle, #ffd700, #ff8c00);
    border-radius: 50%;
    position: absolute;
    top: -2vw;
    left: 50%;
    margin-left: -50%;
    transform: translateX(-50%) scale(1);
    animation: flicker 0.4s infinite alternate;
    transition: transform 0.5s ease, opacity 0.5s ease;
}


.flame.off {
   animation: none;
    transform: translateX(-50%) scale(0);
    opacity: 0;

}

@keyframes flicker {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(1.15); opacity: 0.7; }
}



.strawberry {
    width: 2.2vw;
    height: 2.2vw;
    background: #ff6b6b;
    background: radial-gradient(circle at 30% 30%, #ff8a8a, #ff4d4d);
    border-radius: 50%;
    position: absolute;
    top: -4.5vh;
}


.strawberry::after {
    content: "";
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    top: 6px;
    left: 6px;
    box-shadow:
        6px 2px #fff,
        2px 8px #fff,
        8px 10px #fff;
}


.s1 { left: 10%; }
.s2 { left: 30%; }
.s3 { left: 50%; }
.s4 { left: 70%; }
.s5 { left: 85%; }

.hint{
    margin-top: 20px;
    text-align: center;
    font-size: 0.6cm;

    color: #292929;
}

.notice-box {
    display: none;
 position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #f1edee;
    border: 2px solid #000000;
    border-radius: 15px;
    padding: 30px 40px;
    font-size: 1.5rem;
    color: #030303;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    z-index: 999;

}
</style>
</head>



<body>

<div class="cake">
    

    <div class="cream"></div>

    <div class="strawberry s1"></div>
    <div class="strawberry s2"></div>
    <div class="strawberry s3"></div>
    <div class="strawberry s4"></div>
    <div class="strawberry s5"></div>

    <!--촛불-->
    <div class="candle" onclick="blowOut()">
        <div class="flame" id="flame"></div>
    </div>
</div>

<!-- 케이크 바깥, 밑으로 이동-->
<div class="hint">
    🎂소원을 빌며, 촛불을 클릭해 주세요!
</div>

<!-- 케이크 아래에 미리 숨겨둔 문구 -->
<div id="birthdayNotice" 
class="notice-box" >
    🎉 진짜 생일파티는 2월 22일! To be continued.. 🎉
</div>


<script>
        // 촛불 끄는 함수
       function blowOut() {
    const flame = document.getElementById("flame");

    // flicker 즉시 멈춤
    flame.style.animation = "none";

    // transition이 적용되도록 약간 지연
    setTimeout(() => {
        flame.classList.add("off");
    }, 20); // 0.02초

    // 0.5초 후 안내 문구 표시
    setTimeout(() => {
        const notice = document.getElementById("birthdayNotice");
        notice.style.display = "block";

    }, 500);

    
}

</script> 



</body>

</html>
