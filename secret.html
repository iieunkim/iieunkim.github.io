<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀 편지 💌</title>

<!-- 손글씨 느낌 폰트 -->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">




<style>
body {
    background-color: #eae6df;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 80px;
}


/* 편지 종이 */
.letter {
    background-color: #f7f3ee;
    width: 500px;
    padding: 50px;
    margin-bottom: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    border-radius: 5px;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 19px;
    line-height: 1.8;
    color: #292929;
    position: relative;
    border-top: 15px solid #f5e0e0;
}

.cake-btn {
    display: block;
    margin: 0 auto;
    text-align: center;
}



/* 날짜 */
.date {
    text-align: right;
    font-size: 18px;
    margin-bottom: 35px;
}

/* 서명 */
.signature {
    text-align: right;
    margin-top: 40px;
}
</style>
</head>

<body>

<div class="letter">
    <div class="date">2026.02.18</div>
    

    사랑하는 현구 🤍<br><br>

    오빠~ 생일 축하해!<br>
    생일 당일날 함께 보내지 못하는게 아쉬워서<br>
    이렇게 오빠만을 위한 축하 페이지를 만들었어!<br>
    세상에 단하나밖에 없는 현구만의 페이지 ~! <br><br>

    올해는 오빠가 더 많이 웃고,<br>
    더 많이 사랑받는 한 해였으면 좋겠어.<br><br>

    항상 오빠의 곁에<br>
    늘 묵묵히 있을게.<br><br>

    Happy Birthday! 사랑해~ 

    
    <div class="signature">
        from. 시은 💌
    </div>

</div>

<button onclick="location.href='cake.html'" class="cake-btn">
    🎂 편지를 다 읽었다면, 눌러주세요!
</button>


</body>
</html>
